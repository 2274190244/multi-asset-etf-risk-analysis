[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-analysis"
version = "0.1.0"
dependencies = [
    "pandas>=2.2,<4.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.12,<2.0",
    "requests>=2.31,<3.0",
    "streamlit>=1.62,<2.0",
    "plotly>=5.24,<7.0",
    "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
