[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F9FB"
textColor = "#18212B"
font = "sans-serif"

[browser]
gatherUsageStats = false

[server]
# This deployed research app does not need development-time source watching.
# Avoid watching runtime-generated directories during atomic publication.
fileWatcherType = "none"
